name: mova
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  uuid: ^4.6.0
  wakelock_plus: ^1.8.2
  share_plus: ^13.3.1
  flutter_local_notifications: ^22.3.3
  flutter_timezone: ^5.1.1
  health: ^13.3.2
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/icons/
    - assets/legal/
    - assets/images/

  fonts:
    - family: Barlow Condensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/BarlowCondensed-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#B7F24C"
  adaptive_icon_foreground: "assets/images/icon_foreground.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#0B0F16"
    theme_color: "#B7F24C"

flutter_native_splash:
  color: "#B7F24C"
  image: "assets/images/splash_logo.png"
  color_dark: "#B7F24C"
  image_dark: "assets/images/splash_logo.png"
  web: true
  android_12:
    color: "#B7F24C"
    image: "assets/images/splash_logo.png"
